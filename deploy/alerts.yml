# Prometheus 告警規則。載入方式:prometheus.yml 的 rule_files(見 deploy/prometheus.yml)。
# 驗證:docker run --rm --entrypoint promtool -v "$PWD:/d" prom/prometheus:latest check rules /d/alerts.yml
groups:
  - name: tenant-saas
    rules:
      - alert: DatabaseDown
        expr: app_db_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 應用程式連不上資料庫
          description: 預約、登入、寄信都會失敗。先看資料庫與連線字串。

      - alert: MetricsMissing
        expr: absent(app_db_up)
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 抓不到應用程式的指標
          description: 應用程式掛了、/metrics 的 token 不對,或網路不通。

      - alert: EmailBacklog
        expr: email_outbox_oldest_due_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 信件積壓超過 5 分鐘
          description: SMTP 壞了或背景 worker 停了(WORKER_ENABLED、worker_tick_errors_total)。顧客收不到確認信就無法完成預約。

      - alert: EmailsFailing
        expr: increase(emails_failed_total[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: 過去一小時有信件最終寄送失敗
          description: 重試用盡仍失敗。檢查 SMTP 帳號、額度與收件者是否有效;email_outbox_failed 可看保留期內的累計。

      - alert: WorkerErrors
        expr: increase(worker_tick_errors_total[15m]) > 3
        labels: { severity: warning }
        annotations:
          summary: 背景 worker 連續出錯
          description: 寄信、提醒、整理過期預約都靠它;看日誌的 worker 錯誤。

      - alert: High5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 5xx 比例超過 1%

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: P99 延遲超過 1 秒

      - alert: LoginLockoutsSpike
        expr: increase(account_locked_total[10m]) > 10
        labels: { severity: warning }
        annotations:
          summary: 短時間內大量帳號被鎖定
          description: 可能有人在猜密碼(撞庫)。看來源 IP 與限流設定。

      - alert: RegistrationSpike
        # 沒有 CAPTCHA:註冊量異常暴增通常是有人在灌帳號 / 拿別人的 Email 當收件者(每個註冊會寄一封驗證信)
        expr: increase(registrations_total[10m]) > 30
        labels: { severity: warning }
        annotations:
          summary: 10 分鐘內註冊超過 30 個帳號
          description: 看來源 IP 與 AUTH_RATE_LIMIT_PER_MIN;必要時暫時調低限流,或在反向代理上擋掉來源。

      - alert: PaymentFailuresHigh
        # 只在有啟用 Stripe 時才有意義
        expr: increase(payment_failed_notified_total[1d]) > 20
        labels: { severity: info }
        annotations:
          summary: 一天內付款失敗通知偏多
          description: 檢查 Stripe 帳號設定或是否有大量卡片過期;不一定是故障。
