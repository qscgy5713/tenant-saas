name: CI

on:
  push:
  pull_request:
  # 每週跑一次:漏洞資料庫每天更新,程式沒動也可能出現新的漏洞
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 格式、靜態檢查、一般測試(用超級使用者連線,和本機開發一致)
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenant
          POSTGRES_PASSWORD: tenant
          POSTGRES_DB: tenant_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenant -d tenant_saas"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tenant:tenant@localhost:5432/tenant_saas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # 用正式環境的受限帳號把整個流程跑一遍。
  # 一般測試都是超級使用者,繞過權限與 RLS,證明不了正式環境的行為;這個工作補上。
  # 需要全新的叢集(PostgreSQL 的角色是整個叢集共用的),所以獨立成一個工作。
  restricted-role:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: admin-pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: admin-pw
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: 佈建 migrator(管理員執行一次)
        run: psql "postgres://postgres@localhost:5432/postgres" -v migrator_password="'migrator-pw'" -f deploy/provision.sql
      - name: 以非超級使用者的 migrator 套用 migration
        run: ./target/debug/tenant-saas migrate
        env:
          MIGRATION_DATABASE_URL: postgres://tenant_migrator:migrator-pw@localhost:5432/tenant_saas
      - name: 啟用 runtime 帳號登入
        run: psql "postgres://tenant_migrator:migrator-pw@localhost:5432/tenant_saas" -c "ALTER ROLE tenant_runtime WITH LOGIN PASSWORD 'runtime-pw'"
      - name: 撤銷 migrator 的成員資格,確認 SECURITY DEFINER 函式不依賴它
        run: >-
          psql "postgres://postgres@localhost:5432/tenant_saas" -v ON_ERROR_STOP=1 -c
          "REVOKE tenant_worker FROM tenant_migrator CASCADE; REVOKE tenant_app FROM tenant_migrator CASCADE;
           GRANT tenant_app TO tenant_runtime WITH INHERIT FALSE, SET TRUE;
           GRANT tenant_worker TO tenant_runtime WITH INHERIT FALSE, SET TRUE;"
      - name: 以受限的 runtime 帳號執行整個流程
        run: cargo test --locked --test restricted_role -- --ignored
        env:
          RESTRICTED_RUNTIME_URL: postgres://tenant_runtime:runtime-pw@localhost:5432/tenant_saas

  # 前端:排版、靜態檢查、型別、測試、建置
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 端對端:真的瀏覽器(Chromium)+ 真的後端 + 真的 PostgreSQL + 真的 SMTP(Mailpit),什麼都不 mock。
  # 元件測試驗證不了的整條流程(登入 cookie、寄信與信中連結、拖曳、跨頁面的狀態)在這裡驗證。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenant
          POSTGRES_PASSWORD: tenant
          POSTGRES_DB: tenant_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenant -d tenant_saas"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_API_CMD: ../target/debug/tenant-saas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: . }
          - { name: web, context: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: tenant-saas-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # 映像漏洞掃描:有「已有修正版」的 HIGH / CRITICAL 就失敗(沒有修正版的無從處理,不擋)
      - name: 漏洞掃描(Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            tenant-saas-${{ matrix.name }}:ci
      # SBOM(CycloneDX):映像裡有哪些套件,供稽核與日後出現漏洞時比對
      - name: 產生 SBOM
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" aquasec/trivy:0.75.0 \
            image --format cyclonedx --output /out/sbom-${{ matrix.name }}.cdx.json --no-progress \
            tenant-saas-${{ matrix.name }}:ci
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/
          retention-days: 90

  # 依賴(Cargo.lock、package-lock.json)的已知漏洞
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 依賴漏洞掃描(Trivy)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --skip-dirs target --skip-dirs node_modules --skip-dirs web/node_modules /src

  # 部署範例本身要能用:告警規則語法與行為、compose 檔能解析
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 告警規則(語法 + 行為)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/d" prom/prometheus:latest check rules /d/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/d" prom/prometheus:latest test rules /d/alerts_test.yml
      - name: 備份腳本(假的 pg_dump,測試清理與驗證邏輯)
        run: bash deploy/backup_test.sh
      - name: docker-compose.prod.yml 能解析
        run: |
          mkdir -p deploy/secrets && echo ci-placeholder-token > deploy/secrets/metrics_token
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/env.prod.example --profile migrate --profile monitoring config -q
